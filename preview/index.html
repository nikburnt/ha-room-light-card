<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Room Light Card · Preview</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#24292b; background:#f1f3f5; --primary-color:#167863; --secondary-text-color:#626f73; --secondary-background-color:#f1f4f5; --divider-color:#e0e4e5; --ha-card-border-radius:8px; }
    * { box-sizing:border-box; letter-spacing:0; }
    body { margin:0; min-height:100vh; }
    body.dark { color:#e8ecee; background:#141719; --primary-text-color:#e8ecee; --secondary-text-color:#a6b0b5; --ha-card-background:#202528; --secondary-background-color:#2c3337; --divider-color:#384248; --primary-color:#63bea6; --state-light-active-color:#ffd073; --room-light-active-background:#463b23; --error-color:#ff9696; --warning-color:#edbd6f; }
    .page { max-width:1080px; margin:auto; padding:32px 24px 56px; }
    .page-header { display:flex; align-items:center; justify-content:space-between; gap:24px; padding-bottom:24px; }
    h1 { margin:0; font-size:26px; font-weight:650; }
    .preview-label { font-size:12px; color:var(--secondary-text-color); margin:6px 0 0; }
    .tools { display:flex; align-items:center; justify-content:end; gap:8px; flex-wrap:wrap; }
    .tools button { display:inline-flex; align-items:center; justify-content:center; background:var(--ha-card-background,#fff); color:inherit; border:1px solid var(--divider-color); border-radius:6px; width:44px; height:44px; cursor:pointer; }
    .tools select { background:var(--ha-card-background,#fff); color:inherit; border:1px solid var(--divider-color); border-radius:6px; padding:10px; min-height:44px; font:inherit; font-size:13px; max-width:100%; }
    ha-icon { display:inline-flex; width:22px; height:22px; }
    #cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; align-items:start; }
    #cards room-light-card { min-width:0; }
    dialog { color:inherit; background:var(--ha-card-background,#fff); border:1px solid var(--divider-color); border-radius:8px; padding:22px; width:520px; max-width:calc(100% - 32px); max-height:85vh; overflow:auto; }
    dialog::backdrop { background:#0006; }
    .dialog-header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; }
    .dialog-header h2 { margin:0; font-size:18px; }
    .dialog-header button { border:0; color:inherit; background:none; width:44px; height:44px; cursor:pointer; display:flex; justify-content:center; align-items:center; }
    #more-info { font-size:14px; overflow-wrap:anywhere; }
    @media(max-width:640px) { .page { padding:22px 16px 40px; } .page-header { align-items:start; flex-direction:column; gap:18px; } .tools { justify-content:start; } #cards { grid-template-columns:minmax(0,1fr); gap:16px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <div><h1>Освещение</h1><p class="preview-label">Демонстрация · без подключения к Home Assistant</p></div>
      <div class="tools">
        <select id="language" aria-label="Язык"><option value="ru">Русский</option><option value="en">English</option></select>
        <select id="scenario" aria-label="Состояние"><option value="normal">Обычный режим</option><option value="off">Всё выключено</option><option value="offline">Нет связи</option><option value="partial">Часть нагрузки недоступна</option></select>
        <button id="theme" type="button" aria-label="Сменить тему" title="Сменить тему"><ha-icon icon="mdi:theme-light-dark"></ha-icon></button>
        <button id="editor" type="button" aria-label="Редактор карточки" title="Редактор карточки"><ha-icon icon="mdi:pencil-outline"></ha-icon></button>
      </div>
    </div>
    <div id="cards"></div>
  </main>
  <dialog id="editor-dialog"><div class="dialog-header"><h2>Карточка комнаты</h2><button id="close-editor" aria-label="Закрыть редактор" title="Закрыть редактор"><ha-icon icon="mdi:close"></ha-icon></button></div><room-light-card-editor></room-light-card-editor></dialog>
  <dialog id="info-dialog"><div class="dialog-header"><h2>Entity</h2><button id="close-info" aria-label="Закрыть" title="Закрыть"><ha-icon icon="mdi:close"></ha-icon></button></div><p id="more-info"></p></dialog>
  <script src="../dist/ha-room-light-card.js"></script>
  <script src="demo.bundle.js"></script>
</body>
</html>
